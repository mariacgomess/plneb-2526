<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link do Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% block head %}{% endblock %} - Dicionário Médico</title>
</head>
<body class="bg-light">

    <!-- Menu de Navegação (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">⚕️ MedDict</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/conceitos">Conceitos</a>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container">
        {% block body %}
        {% endblock %}
    </div>

    <footer class="text-center mt-5 py-3 text-muted">
        <p>&copy; 2026 Dicionário Médico Digital</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
