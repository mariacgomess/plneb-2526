{% extends 'layout.html' %}

{% block head %}
    <title>Lista de Conceitos</title>
{% endblock %}

{% block body %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <h2 class="mb-4 text-secondary text-center">Índice de Termos Médicos</h2>
            
            <!-- Barra de Procura Visual -->
            <div class="input-group mb-4 shadow-sm">
                <input type="text" class="form-control" placeholder="Procure um termo..." aria-label="Procura">
                <button class="btn btn-primary" type="button">🔍</button>
            </div>

            <!-- Lista de Conceitos -->
            <div class="list-group shadow-sm">
                {% for c in conceitos %}
                    <a href="/conceitos/{{ c }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                        <span class="fw-bold">{{ c }}</span>
                        <span class="badge bg-primary rounded-pill">Ver definição</span>
                    </a>
                {% endfor %}
            </div>

            {% if not conceitos %}
                <div class="alert alert-warning mt-3">
                    Nenhum conceito encontrado no dicionário.
                </div>
            {% endif %}
            
            <div class="mt-4">
                <a href="/" class="btn btn-link">← Voltar à Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
